name: WodTimer
options:
  bundleIdPrefix: com.wodtimer
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  WodTimer:
    type: application
    platform: iOS
    sources:
      - WodTimer
      - WodTimerShared
    settings:
      base:
        INFOPLIST_FILE: WodTimer/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wodtimer.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: WodTimer/WodTimer.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: WodTimer/Info.plist
      properties:
        CFBundleDisplayName: WodTimer
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UIBackgroundModes:
          - audio

  WodTimerWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - WodTimerWatch
      - WodTimerShared
    settings:
      base:
        INFOPLIST_FILE: WodTimerWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wodtimer.app.watchkitapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies: []
    info:
      path: WodTimerWatch/Info.plist
      properties:
        CFBundleDisplayName: WodTimer
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.wodtimer.app

  WodTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WodTimerTests
    dependencies:
      - target: WodTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wodtimer.tests

schemes:
  WodTimer:
    build:
      targets:
        WodTimer: all
        WodTimerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WodTimerTests
